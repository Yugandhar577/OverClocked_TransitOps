services:
  postgres:
    image: postgres:15-alpine
    container_name: transitops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitops}
      POSTGRES_USER: ${POSTGRES_USER:-transitops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitops}
    ports:
      - "5433:5432"
    volumes:
      - transitops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./SRC/Backend
    container_name: transitops-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-transitops}:${POSTGRES_PASSWORD:-transitops}@postgres:5432/${POSTGRES_DB:-transitops}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MAP_PROVIDER: ${MAP_PROVIDER:-openstreetmap}
      DIRECTIONS_PROVIDER: ${DIRECTIONS_PROVIDER:-straight_line}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      TRACKING_UPDATE_INTERVAL_SECONDS: ${TRACKING_UPDATE_INTERVAL_SECONDS:-10}
      TRACKING_STATIONARY_INTERVAL_SECONDS: ${TRACKING_STATIONARY_INTERVAL_SECONDS:-25}
      TRACKING_STALE_SECONDS: ${TRACKING_STALE_SECONDS:-60}
      TRACKING_OFFLINE_SECONDS: ${TRACKING_OFFLINE_SECONDS:-180}
      TRACKING_RAW_RETENTION_DAYS: ${TRACKING_RAW_RETENTION_DAYS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./SRC/Frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: transitops-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  transitops-postgres-data:

