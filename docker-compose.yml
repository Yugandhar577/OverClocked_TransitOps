services:
  backend:
    build:
      context: ./SRC/Backend
    container_name: transitops-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./SRC/Frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: transitops-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

