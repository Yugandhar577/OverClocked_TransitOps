services:
  postgres:
    image: postgres:15-alpine
    container_name: transitops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitops}
      POSTGRES_USER: ${POSTGRES_USER:-transitops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitops}
    ports:
      - "5433:5432"
    volumes:
      - transitops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./SRC/Backend
    container_name: transitops-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-transitops}:${POSTGRES_PASSWORD:-transitops}@postgres:5432/${POSTGRES_DB:-transitops}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - transitops-receipts:/app/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./SRC/Frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: transitops-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  transitops-postgres-data:
  transitops-receipts:

